---
- name: Immutable Host Maintenance & Pruning Cycle
  hosts: nodes
  become: true
  gather_facts: true

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted

    - name: Warn reboot
      ansible.builtin.debug:
        msg: "CRITICAL: A system reboot has been scheduled for 1 minute from now. Network services will briefly go offline."

  tasks:
    # --- LAYER 0: PRE-FLIGHT REPOSITORY KEYRING SYNCS ---
    - name: Ensure /etc/apt/keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Synchronize GitHub CLI apt signing key
      ansible.builtin.get_url:
        url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0644'
        force: true
      loop:
        - /etc/apt/keyrings/githubcli-archive-keyring.gpg
        - /usr/share/keyrings/githubcli-archive-keyring.gpg
      failed_when: false

    # --- LAYER 1: AUTOMATED SECURITY PATCHING SEEDS ---
    - name: Ensure automated core patching utilities are present
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - apt-listchanges
        state: present
        update_cache: true
        cache_valid_time: 3600

    # git and curl are used directly by deploy_infrastructure/run_renovate
    # (git diff, curl against the GitLab API); jq parses those curl
    # responses in run_renovate's bot-token self-rotation step. All three
    # were previously only a one-time manual bootstrap step (README), with
    # nothing keeping them installed - the LAYER 2 autoremove/purge below
    # can silently drop a package that only ever got pulled in as someone
    # else's dependency, and jq did exactly that (confirmed live: every
    # scheduled run_renovate job failed for days on "jq: command not
    # found" before this task existed). Declaring them here makes them
    # self-healing instead of a step that can only be run once by hand.
    - name: Ensure CI automation utilities are present
      ansible.builtin.apt:
        name:
          - curl
          - git
          - jq
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Seed persistent unattended-upgrades security rule profiles
      ansible.builtin.copy:
        src: files/50unattended-upgrades
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Seed cron timing interval drivers for apt updates
      ansible.builtin.copy:
        src: files/20auto-upgrades
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'

    # --- LAYER 2: INTERACTIVE SCHEDULED APT BUMPS ---
    - name: Hold gitlab-runner to prevent self-upgrade pipeline termination
      ansible.builtin.dpkg_selections:
        name: gitlab-runner
        selection: hold

    - name: Execute clean non-disruptive safe upgrade on host binaries
      ansible.builtin.apt:
        upgrade: safe
      register: apt_upgrade_output

    - name: Force purge obsolete structural packages and dependencies (autoremove)
      ansible.builtin.apt:
        autoremove: true
        purge: true

    # --- LAYER 3: DOCKER DISK PURGING LOOP ---
    - name: Enforce global Docker daemon log rotation caps host-wide
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-size": "10m",
              "max-file": "3"
            }
          }
      notify: Restart docker
      register: docker_daemon_config

    - name: Apply pending Docker daemon restart before evaluating reboot state
      ansible.builtin.meta: flush_handlers

    - name: Clear cached dangling Docker build artifacts and pulled image layers
      community.docker.docker_prune:
        containers: false
        images: true
        images_filters:
          dangling: "true"
        networks: false
        volumes: false
      register: docker_prune_output

    # --- LAYER 4: STATE VERIFICATION ---
    - name: Check if kernel alterations or system updates dictate a pending reboot
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_state

    - name: Surface host maintenance metric report summary
      ansible.builtin.debug:
        msg:
          - "Host Processing Complete: {{ inventory_hostname }}"
          - "Apt Changes Applied: {{ apt_upgrade_output.changed }}"
          - "Docker Layers Purged: {{ docker_prune_output.images_pruned | default('0') }} layers dropped"
          - "System Reboot Required: {{ reboot_state.stat.exists | string | upper }}"

    # --- LAYER 5: LOCAL DETACHED REBOOT ---
    - name: Schedule a delayed local host reboot if required by system patches
      ansible.builtin.command: shutdown -r +1 'GitOps Scheduled Maintenance Reboot'
      when: reboot_state.stat.exists
      notify: Warn reboot
      register: reboot_scheduled

    # --- LAYER 6: CONTROLLED RUNNER UPGRADE (OPTIONAL) ---
    - name: Unhold gitlab-runner to allow updates
      ansible.builtin.dpkg_selections:
        name: gitlab-runner
        selection: install

    - name: Update gitlab-runner at the very end of the cycle # noqa: package-latest
      ansible.builtin.apt:
        name: gitlab-runner
        state: latest
      async: 10
      poll: 0
# EOF
