services:
  # --- Init Container: Pulls Latest CrowdSec Bouncer Assets ---
  bouncer-assets-init:
    image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: bouncer-assets-init
    user: "root"
    volumes:
      - /home/user/docker/traefik/data:/target_dir
    command: >
      sh -c "
        echo 'Fetching upstream CrowdSec Traefik Bouncer remediation pages...';
        wget -qO /target_dir/captcha.html https://raw.githubusercontent.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/main/captcha.html;
        wget -qO /target_dir/ban.html https://raw.githubusercontent.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/main/ban.html;
        chmod 644 /target_dir/captcha.html /target_dir/ban.html;
        echo 'Remediation assets synchronized successfully.';
      "

  # --- Init Container: Waits for DNS to be reachable ---
  wait-for-dns:
    image: busybox:latest@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    container_name: traefik-wait-for-dns
    networks:
      - reverse_proxy
    command: >
      sh -c "
        echo 'Waiting for local AdGuard DNS (adguard_unbound)...';
        until nc -z -w 2 adguard_unbound 53; do sleep 2; done;
        echo 'Local DNS is reachable. Continuing startup.';
      "

  # --- Main Edge Routing Gateway ---
  traefik:
    image: traefik:v3.7@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
    container_name: traefik
    restart: unless-stopped
    hostname: rpi5
    security_opt:
      - no-new-privileges:true    
    depends_on:
      bouncer-assets-init:
        condition: service_completed_successfully
      wait-for-dns:
        condition: service_completed_successfully

    extra_hosts:
      - "crowdsec.local.example.com:10.10.9.2" #Should be updated to point to LAPI
    networks:
      - reverse_proxy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "61542:61542/udp"     # High-port tunnel interface mapping
    environment:
      - CLOUDFLARE_EMAIL=${CF_API_EMAIL}
      - CLOUDFLARE_API_KEY=${CF_API_KEY}
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY}
      - CAPTCHA_SITE_KEY=${CAPTCHA_SITE_KEY}
      - CAPTCHA_SECRET_KEY=${CAPTCHA_SECRET_KEY}
      - FRIGATE_PROXY_SECRET=${FRIGATE_PROXY_SECRET}  
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/user/docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /home/user/docker/traefik/config.yml:/config.yml:ro
      - /home/user/docker/traefik/log:/var/log:rw
      - /home/user/docker/traefik/data/acme.json:/acme.json
      # Remediation page mappings dynamically populated by the init container
      - /home/user/docker/traefik/data/captcha.html:/captcha.html:rw
      - /home/user/docker/traefik/data/ban.html:/ban.html:rw
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse_proxy"
      
      # --- Router Configuration: Public Dashboard Access ---
      - "traefik.http.routers.traefik.entrypoints=https"
      - "traefik.http.routers.traefik.rule=Host(`traefik.example.com`)"
      - "traefik.http.routers.traefik.tls=true"
      - "traefik.http.routers.traefik.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik.tls.options=default"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.middlewares=https-redirect@file, default-headers@file, forward-auth"

      # --- Router Configuration: Local Namespace Dashboard Access (*.local) ---
      - "traefik.http.routers.traefik-local.entrypoints=https"
      - "traefik.http.routers.traefik-local.rule=Host(`traefik.local.example.com`)"
      - "traefik.http.routers.traefik-local.tls=true"
      - "traefik.http.routers.traefik-local.tls.certresolver=cloudflare"
      - "traefik.http.routers.traefik-local.tls.options=default"
      - "traefik.http.routers.traefik-local.service=api@internal"
      - "traefik.http.routers.traefik-local.middlewares=https-redirect@file, forward-auth-local, default-headers@file"
# --- Containerized IaC Logrotate Sidecar ---
  logrotate:
    image: alpine:latest@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    container_name: traefik_logrotate
    restart: unless-stopped
    volumes:
      - /home/user/docker/traefik/log:/var/log/traefik:rw
      - ./logrotate.conf:/etc/logrotate.d/traefik:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: |
      sh -c "
        apk add --no-cache logrotate docker-cli &&
        # Secure the mounted config permissions into internal container space       
        cp /etc/logrotate.d/traefik /tmp/traefik.conf &&
        chmod 644 /tmp/traefik.conf &&        
        # Override Alpine daily cron script to evaluate our targeted configurations explicitly
        echo '#!/bin/sh' > /etc/periodic/daily/logrotate &&
        echo 'logrotate -s /var/log/traefik/logrotate.status /tmp/traefik.conf' >> /etc/periodic/daily/logrotate &&
        chmod +x /etc/periodic/daily/logrotate &&        
        echo 'Executing boot-time log rotation check with persistent state tracker...' &&
        logrotate -s /var/log/traefik/logrotate.status /tmp/traefik.conf || true &&        
        echo 'Logrotate crond engine initialization complete.' &&
        exec crond -f -l 2
      "
# --- Shared Global Subnet Matrix Definitions ---
networks:
  reverse_proxy:
    external: true
