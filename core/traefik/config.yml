http:
 #region routers 
  routers:
    frigate:
      entryPoints:
        - http
        - https
      rule: "Host(`frigate.example.com`)"
      service: frigate-service
      middlewares:
        - https-redirect@file
        - default-headers@file
        - forward-auth@docker
        - frigate-headers@file
        - frigate-admin@file
      tls:
        certResolver: cloudflare
        options: default 
    frigate-local:
      entryPoints:
        - http
        - https
      rule: "Host(`frigate.local.example.com`)"
      service: frigate-service
      middlewares:
        - https-redirect@file
        - default-headers@file
        - forward-auth-local@docker
        - frigate-headers@file
        - frigate-admin@file
      tls:
        certResolver: cloudflare
        options: default
    param:
      entryPoints:
        - http
        - https
      rule: "Host(`param.example.com`)"
      middlewares:
        - default-headers@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare
      service: param
    param-local:
      entryPoints:
        - http
        - https
      rule: "Host(`param.local.example.com`)"
      middlewares:
        - forward-auth-local@docker
        - internal@file
      tls:
        options: default
        certresolver: cloudflare        
      service: param
    proxmox:
      entryPoints:
        - http
        - https
      rule: "Host(`proxmox.example.com`)"
      middlewares:
        - default-headers@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: proxmox
    proxmox-local:
      entryPoints:
        - http
        - https
      rule: "Host(`proxmox.local.example.com`)"
      middlewares:
        - forward-auth-local@docker
        - internal@file
      tls:
        options: default
        certresolver: cloudflare        
      service: proxmox   
    machinaris:
      entryPoints:
        - http
        - https
      rule: "Host(`machinaris.example.com`)"
      middlewares:
        - default-headers@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: machinaris
    machinaris-local:
      entryPoints:
        - http
        - https
      rule: "Host(`machinaris.local.example.com`)"
      middlewares:
        - forward-auth-local@docker
        - internal@file
      tls:
        options: default
        certresolver: cloudflare        
      service: machinaris
    proxmox_dns:
      entryPoints:
        - http
        - https
      rule: "Host(`proxmoxdns.example.com`)"
      middlewares:
        - default-headers@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: proxmoxdns
    proxmox_dns_local:
      entryPoints:
        - https
      rule: "Host(`proxmoxdns.local.example.com`)"
      middlewares:
        - default-headers@file
        - forward-auth-local@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: proxmoxdns      
    adguard:
      entryPoints:
        - http
        - https
      rule: "Host(`adguard.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: adguard
    adguard_doh:
      entryPoints:
        - http
        - https
      rule: "(Host(`adguard.example.com`) && PathPrefix(`/dns-query`)) || (Host(`adguard.local.example.com`) && PathPrefix(`/dns-query`)) "
      # Higher priority than the adguard dashboard router so /dns-query is never
      # captured by (and forced through forward-auth on) the dashboard route.
      priority: 1000
      middlewares:
        - default-headers@file
        - https-redirect@file
        - strip-client-ip-headers
      tls:
        options: default
        certresolver: cloudflare        
      service: adguard_doh
    # DoH through Cloudflare: keep its CF-Connecting-IP (the visitor's IP,
    # which AdGuard uses for the client address). A request carrying that
    # header from anywhere but Cloudflare is forged and gets a 403.
    adguard_doh_cf:
      entryPoints:
        - http
        - https
      rule: "((Host(`adguard.example.com`) && PathPrefix(`/dns-query`)) || (Host(`adguard.local.example.com`) && PathPrefix(`/dns-query`))) && HeaderRegexp(`CF-Connecting-IP`, `.+`)"
      priority: 1001
      middlewares:
        - default-headers@file
        - https-redirect@file
        - cloudflare-only
      tls:
        options: default
        certresolver: cloudflare
      service: adguard_doh
    adguard-local:
      entryPoints:
        - http
        - https
      rule: "Host(`adguard.local.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth-local@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: adguard
    adguard2:
      entryPoints:
        - http
        - https
      rule: "Host(`adguard2.local.example.com`) || Host(`adguard2.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: adguard2
    adguard3:
      entryPoints:
        - http
        - https
      rule: "Host(`adguard3.local.example.com`) || Host(`adguard3.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare        
      service: adguard3
    adguard4:
      entryPoints:
        - http
        - https
      rule: "Host(`adguard4.local.example.com`) || Host(`adguard4.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare
      service: adguard4
    adguard5:
      entryPoints:
        - http
        - https
      rule: "Host(`adguard5.local.example.com`) || Host(`adguard5.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare
      service: adguard5
    # lapi/bitwarden/uptime all point at the same backend
    # (dns-cluster-services, https://10.10.12.5:8443) - that's dnsgaruda's
    # own internal Traefik (homelab-core-dns's roles/traefik_frontend),
    # which does its own Host()-based routing to whichever of
    # crowdsec_lapi/vaultwarden/uptime_kuma the request is actually for.
    # No auth middleware on any of these three - each has its own auth
    # (LAPI: bouncer API keys/machine credentials, Vaultwarden: master
    # password, Uptime Kuma: its own login), same reasoning as adguard/
    # adguard-local above.
    lapi-local:
      entryPoints:
        - http
        - https
      rule: "Host(`lapi.local.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    bitwarden:
      entryPoints:
        - http
        - https
      rule: "Host(`bitwarden.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    # Vaultwarden's admin page behind forward-auth (rule.admin narrows it to
    # the admin accounts). The cluster's Traefik only serves /admin to the
    # edges, so this is the only way in.
    bitwarden-admin:
      entryPoints:
        - http
        - https
      rule: "Host(`bitwarden.example.com`) && PathPrefix(`/admin`)"
      priority: 200
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    uptime:
      entryPoints:
        - http
        - https
      rule: "Host(`uptime.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    # AdGuardHome-sync's status UI (homelab-core-dns's roles/adguardhome_sync),
    # on the VIP holder; it has no login of its own.
    adguardsync:
      entryPoints:
        - http
        - https
      rule: "Host(`adguardsync.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    adguardsync-local:
      entryPoints:
        - http
        - https
      rule: "Host(`adguardsync.local.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
        - forward-auth-local@docker
        - internal@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    uptime-local:
      entryPoints:
        - http
        - https
      rule: "Host(`uptime.local.example.com`)"
      middlewares:
        - default-headers@file
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    # dnsgaruda's own internal Traefik dashboard/API (homelab-core-dns's
    # roles/traefik_frontend) - same dns-cluster-services backend as
    # lapi/bitwarden-test/uptime above, but this hostname is matched by
    # that instance's own traefik-dashboard router (service: api@internal)
    # rather than one of the app backends. Forward-auth-protected here,
    # same pattern as this node's own traefik.example.com/traefik-local
    # dashboard routers (docker-compose.yml labels) - the dashboard has no
    # auth of its own.
    traefik-cluster:
      entryPoints:
        - http
        - https
      rule: "Host(`traefik-cluster.example.com`)"
      middlewares:
        - default-headers@file
        - forward-auth@docker
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    traefik-cluster-local:
      entryPoints:
        - http
        - https
      rule: "Host(`traefik-cluster.local.example.com`)"
      middlewares:
        - forward-auth-local@docker
        - internal@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    # dnsgaruda's own Traefik metrics (homelab-core-dns's
    # roles/traefik_frontend, its own traefik-metrics router) - same
    # dns-cluster-services backend, internal-only same as this node's own
    # tm-rpi5.local.example.com metrics router (docker-compose.yml labels).
    # Prometheus (on param) is what actually scrapes this.
    tm-dnsgaruda:
      entryPoints:
        - https
      rule: "Host(`tm-dnsgaruda.local.example.com`)"
      middlewares:
        - internal@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    # dnsgaruda's CrowdSec metrics (homelab-core-dns's roles/crowdsec_lapi,
    # via traefik_frontend's crowdsec-metrics router) - same pattern as
    # tm-dnsgaruda above. Prometheus (on param) scrapes this.
    cs-dnsgaruda:
      entryPoints:
        - https
      rule: "Host(`cs-dnsgaruda.local.example.com`)"
      middlewares:
        - internal@file
      tls:
        options: default
        certresolver: cloudflare
      service: dns-cluster-services
    plex:
      entryPoints:
        - http
        - https
      rule: "Host(`plex.example.com`)"
      middlewares:
        - default-headers@file
      tls:
        options: default
        certresolver: cloudflare        
      service: plex
    plex-local:
      entryPoints:
        - http
        - https
      rule: "Host(`plex.local.example.com`)"
      middlewares:
        - default-headers@file
      tls:
        options: default
        certresolver: cloudflare        
      service: plex  
    homeassistant-local:
      entryPoints:
        - http
        - https
      rule: "Host(`homeassistant.local.example.com`)"
      middlewares:
        - homeassistant-headers
        - ha-retry
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare        
      service: homeassistant-local
    homeassistant:
      entryPoints:
        - http
        - https
      rule: "Host(`homeassistant.example.com`)"
      middlewares:
        - homeassistant-headers
        - ha-retry
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare
      service: homeassistant
    aloy-local:
      entryPoints:
        - http
        - https
      rule: "Host(`aloy.local.example.com`)"
      middlewares:
        - homeassistant-headers
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare        
      service: aloy-local
    aloy:
      entryPoints:
        - http
        - https
      rule: "Host(`aloy.example.com`)"
      middlewares:
        - homeassistant-headers
        - https-redirect@file
      tls:
        options: default
        certresolver: cloudflare
      service: aloy      
    roon:
      entryPoints:
        - http
        - https
      rule: "Host(`roon.local.example.com`)"
      middlewares:
        - internal@file
      tls:
        options: default
        certresolver: cloudflare        
      service: roon 
    param-wildcard-fallback:
      entryPoints:
        - http
        - https
      rule: "Host(`*.example.com`) || Host(`*.local.example.com`) || Host(`*.example.ca`) || Host(`*.local.example.ca`) || Host(`example.com`) || Host(`*.example.com`) || Host(`*.local.example.com`) "
      priority: 1
      tls:
        options: default
        certresolver: cloudflare
        domains:
          - main: "example.com"
            sans:
              - "*.example.com"
          - main: "local.example.com"
            sans:
              - "*.local.example.com"
          - main: "example.ca"
            sans:
              - "*.example.ca"
          - main: "local.example.ca"
            sans:
              - "*.local.example.ca"
          - main: "example.com"
            sans:
              - "*.example.com"
          - main: "local.example.com"
            sans:
              - "*.local.example.com"
      service: downstream-param
#endregion

#region services
  # TEMP (HA stall investigation, 2026-09-24): HA sits across the Site Magic
  # tunnel; fail a stuck dial in 5s (default 30s) so ha-retry can kick in.
  serversTransports:
    ha-remote:
      forwardingTimeouts:
        dialTimeout: 5s
  services:
    downstream-param:
      loadBalancer:
        servers:
          - url: https://10.10.9.2:443
    frigate-service:
      loadBalancer:
        servers:
          - url: https://192.168.11.3:8971
    param:
      loadBalancer:
        servers:
          - url: "https://10.10.9.2:1443"
        passHostHeader: true
    proxmox:
      loadBalancer:
        servers:
          - url: "https://192.168.2.2:8006"
        passHostHeader: true
    machinaris:
      loadBalancer:
        servers:
          - url: "http://192.168.2.5:8926"
        passHostHeader: true
    proxmoxdns:
      loadBalancer:
        servers:
          - url: "http://192.168.2.3:80"
        passHostHeader: true
    adguard:
      loadBalancer:
        servers:
          - url: "https://192.168.12.3:443"         
        passHostHeader: true
    adguard_doh:
      failover:
        service: chicago_pis
        fallback: canada_pis

    # ----------------------------------------------------
    # LOCAL CHICAGO PIS
    # ----------------------------------------------------
    chicago_pis:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: "/"
          interval: 10s
          timeout: 3s
        servers:
          - url: "https://10.10.12.3:443/dns-query"
          - url: "https://10.10.12.4:443/dns-query"
          - url: "https://10.10.12.6:443/dns-query"

    # ----------------------------------------------------
    # REMOTE CANADA PIS
    # ----------------------------------------------------
    canada_pis:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "https://192.168.12.3:443/dns-query"
          - url: "https://192.168.12.4:443/dns-query"
    adguard2:
      loadBalancer:
        servers:
          - url: "https://192.168.12.4:443"
        passHostHeader: true
    adguard3:
      loadBalancer:
        servers:
          - url: "https://10.10.12.3:443"
        passHostHeader: true
    adguard4:
      loadBalancer:
        servers:
          - url: "https://10.10.12.4:443"
        passHostHeader: true
    adguard5:
      loadBalancer:
        servers:
          - url: "https://10.10.12.6:443"
        passHostHeader: true
    # Backend for lapi/lapi-local/bitwarden/uptime/uptime-local routers
    # above - the VIP already handles node failover at the network level
    # (whichever of dnsgaruda1/2/3 currently holds it answers), and that
    # node's own traefik_frontend does its own Host()-based routing to
    # the right local service from here, so passHostHeader is required -
    # without it, that routing can't tell lapi/bitwarden/uptime apart.
    dns-cluster-services:
      loadBalancer:
        servers:
          - url: "https://10.10.12.5:8443"
        passHostHeader: true
    plex:
      loadBalancer:
        servers:
          - url: "https://10.10.9.2:32400"
        passHostHeader: true     
    homeassistant-local:
      loadBalancer:
        serversTransport: ha-remote
        servers:
          - url: "http://192.168.11.2:8123"
    homeassistant:
      loadBalancer:
        serversTransport: ha-remote
        servers:
          - url: "http://192.168.11.2:8123"
    aloy-local:
      loadBalancer:
        servers:
          - url: "http://10.10.11.2:8123"
    aloy:
      loadBalancer:
        servers:
          - url: "http://10.10.11.2:8123"          
    roon:
      loadBalancer:
        servers:
          - url: "http://10.10.9.2:3000"
        passHostHeader: true          
#endregion

  middlewares:
    # TEMP (HA stall investigation, 2026-09-24): retry failed dials to the
    # remote HA over Site Magic instead of hanging on them.
    ha-retry:
      retry:
        attempts: 3
        initialInterval: 500ms
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true

    crowdsec-stable-bouncer:
      plugin:
        bouncer:
          enabled: true
          logLevel: INFO
          LogFilePath: "/var/log/bouncer.log"
          # Key read from a file (written by bouncer-assets-init from
          # CROWDSEC_API_KEY) so it never appears in Traefik's API response.
          crowdseclapikeyfile: /lapikey
          crowdseclapischeme: https
          # Resolved to the dnsgaruda VIP by extra_hosts (docker-compose.yml),
          # so these bypass this Traefik and hit the cluster's own TLS hop.
          crowdseclapihost: lapi.local.example.com:8443
          crowdsecappsecenabled: true
          # AppSec runs in this host's own CrowdSec agent (core/security, :7422).
          crowdsecappsecscheme: http
          crowdsecappsechost: crowdsec:7422
          # Fail open while AppSec is new (both default to true).
          crowdsecappsecfailureblock: false
          crowdsecappsecunreachableblock: false
          crowdseclapitlscertificateauthorityfile: /etc/ssl/certs/ca-certificates.crt
          redisCacheEnabled: false
          # Stream mode: pulls the full ban list every UpdateIntervalSeconds
          # instead of querying the LAPI per request - this is the primary
          # internet-facing edge, and rpi5 + param both hitting the LAPI
          # live per-request was the bulk of its traffic.
          CrowdsecMode: stream
          UpdateIntervalSeconds: 10
          # -1: a failed pull keeps serving the last-synced list. The default
          # (0) blocks EVERY request after one failed pull until the next
          # succeeds, so a seconds-long LAPI blip 403s all traffic. A dead
          # LAPI is caught by the daily health report instead.
          UpdateMaxFailure: -1
          captchaProvider: recaptcha
          captchaSiteKey: '{{ env "CAPTCHA_SITE_KEY" }}'
          captchaSecretKey: '{{ env "CAPTCHA_SECRET_KEY" }}'
          captchaGracePeriodSeconds: 1800
          captchaHTMLFilePath: /captcha.html
          banHTMLFilePath: /ban.html
          # Internal ranges only. Outside addresses belong in the cluster LAPI's
          # allowlist (allowlist.csv): an allowlisted IP gets no decisions and
          # skips AppSec, so the bouncer needs no copy of them.
          clienttrustedips:
            # Param
            - "10.10.9.1"
            - "10.10.9.5"
            - "10.10.9.2/32"
            - "fd00:1234:10:9::2"
            # Home Assistant, Canada (offsite, Site Magic)
            - "192.168.11.2/32"
            - "fd00:1234:11:0:a087:56ad:25a5:61fd"
            # Home Assistant, Chicago (the primary; stable-privacy ULA)
            - "10.10.11.2/32"
            - "fd00:1234:10:11:4bde:f646:31a6:c24f"
            # Docker net reverse_proxy
            - "172.19.0.0/16"
            - "fd64:b93:59ea::/64"  
            # Primary LAN
            - "10.10.1.0/24"
            - "fd00:1234:10:1::/64"
            # DNS cluster VLAN (dnsgaruda nodes, the VIP, their CI runners)
            - "10.10.12.0/28"
            - "fd00:1234:10:12::/64"
          forwardedheaderstrustedips:
            - "127.0.0.1/32"
            - "10.10.9.5/32"
            - "10.10.9.2/32"
            # KC_CF_DYNAMIC_START
            # KC_CF_DYNAMIC_END     
    frigate-headers:
      headers:
        customRequestHeaders:
          X-Proxy-Secret: '{{ env "FRIGATE_PROXY_SECRET" }}'
          
    frigate-admin:
      headers:
        customRequestHeaders:
          X-Forwarded-Groups: admin
          
    default-headers:
      headers:
        sslRedirect: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    homeassistant-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        sslRedirect: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 63072000
        customFrameOptionsValue: SAMEORIGIN

    # Cloudflare's edge ranges (filled from KC_CF_DYNAMIC by
    # sync_cloudflare_ips.py), matched against the connecting address.
    cloudflare-only:
      IPAllowList:
        sourceRange:
            # KC_CF_DYNAMIC_START
            # KC_CF_DYNAMIC_END
    # AdGuard takes the client IP from CF-Connecting-IP / True-Client-IP
    # before X-Real-IP. Requests with CF-Connecting-IP go to adguard_doh_cf;
    # drop both from the rest (direct to the WAN IP) so AdGuard uses
    # Traefik's X-Real-IP, which its allowed_clients trusts.
    strip-client-ip-headers:
      headers:
        customRequestHeaders:
          CF-Connecting-IP: ""
          True-Client-IP: ""
    internal-ipwhitelist:
      IPAllowList:
        sourceRange:
          # localhost
          - "127.0.0.1/32"
          # Primary LAN          
          - "10.10.1.0/24"
          - "fd00:1234:10:1::/64"
          - "10.20.1.0/24"
          - "fd00:1234:20:1::/64"
          # Vishnu
          - "10.10.3.0/24"
          - "fd00:1234:10:3::/64"
          # Param
          - "10.10.9.1"          
          - "10.10.9.2"
          - "fd00:1234:10:9::2"
          # Home Assistant
          - "192.168.11.2"
          - "fd00:1234:11:0:a087:56ad:25a5:61fd"          
          # Docker reverse proxy
          - "172.19.0.0/16"
          - "fd64:b93:59ea::/64"
          - "172.21.0.0/16"
          - "fd64:b93:59ea:1::/64"          
          # WiFi Man
