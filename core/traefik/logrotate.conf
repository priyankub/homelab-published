/var/log/traefik/access.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    postrotate
        # docker exec, not docker kill: any docker kill marks traefik manually
        # stopped, so unless-stopped would leave it down after a power loss.
        docker exec traefik kill -USR1 1 >/dev/null 2>&1 || true
    endscript
}

/var/log/traefik/bouncer.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    copytruncate
}

/var/log/traefik/ha-probe.log {
    weekly
    rotate 4
    missingok
    notifempty
    compress
    copytruncate
}
